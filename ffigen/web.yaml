output: '../lib/src/bindings/src/rp3d_js_interop.g.dart'
headers:
  entry-points:
    - '../native/include/c_api/rp3d_c_api.h'
  include-directives:
    - '../native/include/c_api/rp3d_c_api.h'
compiler-opts-automatic:
  macos:
    include-c-standard-library: false
compiler-opts:
  - "--target=wasm32-unknown-emscripten"
structs:
  dependency-only: full
  exclude:
    - '.*'
unions:
  dependency-only: opaque
  exclude:
    - '.*'
ignore-source-errors: false
silence-enum-warning: true
enums:
  as-int:
    include:
      - .*
comments:
  style: any
  length: full
