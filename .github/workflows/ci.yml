name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        # The generated bindings are excluded from analysis (see
        # analysis_options.yaml) and sit behind a conditional export, so they
        # are type checked by the web-bindings job below instead.
      - run: dart analyze --no-fatal-warnings

  web-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        # bindings.dart only exports the JS interop bindings on the web, so a
        # VM analyze pass never sees them. Compiling the smoke entry point
        # pulls in the whole package and forces dart2js to type check the
        # generated bindings against the ffigen_js runtime.
      - run: dart compile js -o web_bindings_smoke.js tool/web_bindings_smoke.dart
      - uses: actions/upload-artifact@v5
        with:
          name: web-bindings-smoke
          path: web_bindings_smoke.js
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build engine static library
        run: |
          scripts/fetch_engine.sh
          cmake -S build/third_party/reactphysics3d -B build/engine \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DRP3D_COMPILE_TESTS=OFF \
              -DRP3D_COMPILE_TESTBED=OFF
          cmake --build build/engine --config Release --parallel
          cp build/engine/libreactphysics3d.a native/linux/x86_64/libreactphysics3d.a
      - run: dart pub get
        # Compiles native/src against the freshly built static library and runs
        # the FFI test suites through the build hook.
      - run: dart test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build engine static library
        shell: bash
        run: |
          scripts/fetch_engine.sh
          export MSYS_NO_PATHCONV=1
          cmake -S build/third_party/reactphysics3d -B build/engine \
              -DCMAKE_BUILD_TYPE=Release \
              -DRP3D_COMPILE_TESTS=OFF \
              -DRP3D_COMPILE_TESTBED=OFF \
              -DCMAKE_CXX_FLAGS="/FIchrono"
          cmake --build build/engine --config Release
          mkdir -p native/windows/x86_64
          cp build/engine/Release/reactphysics3d.lib native/windows/x86_64/reactphysics3d.lib
      - run: dart pub get
      - run: dart test
